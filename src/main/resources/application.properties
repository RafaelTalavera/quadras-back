spring.application.name=costanorte
spring.profiles.default=local

server.port=${PORT:${COSTANORTE_SERVER_PORT:${QUADRAS_SERVER_PORT:8080}}}

# Base de datos: orden de prioridad
# 1) COSTANORTE_DB_URL / COSTANORTE_DB_USER / COSTANORTE_DB_PASSWORD
# 2) QUADRAS_DB_URL / QUADRAS_DB_USER / QUADRAS_DB_PASSWORD
# 3) DB_URL / DB_USERNAME / DB_PASSWORD
# 4) COSTANORTE_DB_HOST / QUADRAS_DB_HOST + PORT + NAME + USER + PASSWORD
spring.datasource.url=${COSTANORTE_DB_URL:${QUADRAS_DB_URL:${DB_URL:jdbc:mysql://${COSTANORTE_DB_HOST:${QUADRAS_DB_HOST:localhost}}:${COSTANORTE_DB_PORT:${QUADRAS_DB_PORT:3306}}/${COSTANORTE_DB_NAME:${QUADRAS_DB_NAME:db_quadras}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}}}
spring.datasource.username=${COSTANORTE_DB_USER:${QUADRAS_DB_USER:${DB_USERNAME:root}}}
spring.datasource.password=${COSTANORTE_DB_PASSWORD:${QUADRAS_DB_PASSWORD:${DB_PASSWORD:sasa}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

costanorte.security.jwt.issuer=${COSTANORTE_JWT_ISSUER:costanorte-backend}
costanorte.security.jwt.secret=${COSTANORTE_JWT_SECRET:costanorte-local-jwt-secret-change-me-2026}
costanorte.security.jwt.expiration-seconds=${COSTANORTE_JWT_EXPIRATION_SECONDS:28800}
costanorte.security.demo-user.enabled=${COSTANORTE_DEMO_USER_ENABLED:true}
costanorte.security.demo-user.username=${COSTANORTE_DEMO_USER_USERNAME:operador.demo}
costanorte.security.demo-user.password=${COSTANORTE_DEMO_USER_PASSWORD:123456}
costanorte.security.demo-user.role=${COSTANORTE_DEMO_USER_ROLE:OPERATOR}
costanorte.features.maintenance-simulation.enabled=${COSTANORTE_FEATURE_MAINTENANCE_SIMULATION_ENABLED:true}
costanorte.maintenance.alerts.zone-id=${COSTANORTE_MAINTENANCE_ALERTS_ZONE_ID:America/Sao_Paulo}
costanorte.maintenance.alerts.detector-interval=${COSTANORTE_MAINTENANCE_ALERTS_DETECTOR_INTERVAL:PT1M}
costanorte.maintenance.alerts.overdue-reminder-interval=${COSTANORTE_MAINTENANCE_ALERTS_OVERDUE_REMINDER_INTERVAL:PT60M}
costanorte.maintenance.alerts.outbox-dispatcher-interval=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_DISPATCHER_INTERVAL:PT10S}
costanorte.maintenance.alerts.outbox-claim-timeout=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_CLAIM_TIMEOUT:PT2M}
costanorte.maintenance.alerts.outbox-retry-initial-delay=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_RETRY_INITIAL_DELAY:PT30S}
costanorte.maintenance.alerts.outbox-retry-max-delay=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_RETRY_MAX_DELAY:PT30M}
costanorte.maintenance.alerts.operational-start=${COSTANORTE_MAINTENANCE_ALERTS_OPERATIONAL_START:06:00}
costanorte.maintenance.alerts.operational-end=${COSTANORTE_MAINTENANCE_ALERTS_OPERATIONAL_END:23:00}
costanorte.maintenance.alerts.detector-batch-size=${COSTANORTE_MAINTENANCE_ALERTS_DETECTOR_BATCH_SIZE:100}
costanorte.maintenance.alerts.outbox-batch-size=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_BATCH_SIZE:50}
costanorte.maintenance.alerts.outbox-max-attempts=${COSTANORTE_MAINTENANCE_ALERTS_OUTBOX_MAX_ATTEMPTS:8}
costanorte.maintenance.alerts.in-app-enabled=${COSTANORTE_MAINTENANCE_ALERTS_IN_APP_ENABLED:false}
costanorte.maintenance.alerts.detector-enabled=${COSTANORTE_MAINTENANCE_ALERTS_DETECTOR_ENABLED:false}
costanorte.maintenance.alerts.sse-enabled=${COSTANORTE_MAINTENANCE_ALERTS_SSE_ENABLED:false}
costanorte.maintenance.alerts.push-enabled=${COSTANORTE_MAINTENANCE_ALERTS_PUSH_ENABLED:false}
costanorte.push-subscriptions.encryption-key=${COSTANORTE_PUSH_SUBSCRIPTIONS_ENCRYPTION_KEY:}
costanorte.firebase.enabled=${COSTANORTE_FIREBASE_ENABLED:false}
costanorte.firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
costanorte.firebase.project-id=${COSTANORTE_FIREBASE_PROJECT_ID:}
costanorte.firebase.connect-timeout=${COSTANORTE_FIREBASE_CONNECT_TIMEOUT:PT5S}
costanorte.firebase.request-timeout=${COSTANORTE_FIREBASE_REQUEST_TIMEOUT:PT10S}
